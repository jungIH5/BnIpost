server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:bnipost}
    username: ${DB_USER:bnipost}
    password: ${DB_PASSWORD:bnipost}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-in-production-min-32-chars}
    expiration-ms: 86400000  # 24h

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/auth/naver/callback}
  auth-url: https://nid.naver.com/oauth2.0/authorize
  token-url: https://nid.naver.com/oauth2.0/token
  profile-url: https://openapi.naver.com/v1/nid/me

instagram:
  client-id: ${META_APP_ID}
  client-secret: ${META_APP_SECRET}
  redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/auth/instagram/callback}
  auth-url: https://api.instagram.com/oauth/authorize
  token-url: https://api.instagram.com/oauth/access_token
  long-lived-token-url: https://graph.instagram.com/access_token
  profile-url: https://graph.instagram.com/me

logging:
  level:
    com.bnipost: DEBUG
    org.springframework.security: INFO
